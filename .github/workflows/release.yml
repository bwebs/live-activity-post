name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract Tag
        id: vars
        run: echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Docker Image
        run: |
          cd backend
          docker build \
            --build-arg APP_VERSION=${{ steps.vars.outputs.tag }} \
            -t myapp-backend:${{ steps.vars.outputs.tag }} .

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract Tag
        id: vars
        run: echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24.13.0

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      - name: Build Web App
        env:
          VITE_APP_VERSION: ${{ steps.vars.outputs.tag }}
        run: |
          cd web
          npm run build

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: web-build-${{ steps.vars.outputs.tag }}
          path: web/dist

  build-mobile-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract Tag
        id: vars
        run: echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24.13.0

      - name: Install Dependencies
        run: |
          cd mobile
          npm install

      - name: Build JS Bundle (Android)
        env:
          APP_VERSION: ${{ steps.vars.outputs.tag }}
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cd mobile
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build JS Bundle (iOS)
        env:
          APP_VERSION: ${{ steps.vars.outputs.tag }}
        run: |
          mkdir -p mobile/ios/main.jsbundle
          cd mobile
          npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output ios/main.jsbundle --assets-dest ios

      - name: Upload Mobile Bundles
        uses: actions/upload-artifact@v3
        with:
          name: mobile-bundles-${{ steps.vars.outputs.tag }}
          path: |
             mobile/android/app/src/main/assets/index.android.bundle
             mobile/ios/main.jsbundle
